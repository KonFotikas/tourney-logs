<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Tourney Logs</title>
<meta name="description" content="Tournament brackets, results and decks.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0b0b'/%3E%3Cpath d='M6 7h8v6h6v6h-6v6H6v-4h4v-4H6zm16 4h4v10h-4z' fill='%23ff7a1a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style id="mb-css">
/* Layout: square-edged scoreboard. Home = list of tournaments; tournament = bracket columns per round. Single black + orange theme. */
:root {
  --bg: #0b0b0b;
  --surface: #151515;
  --surface-2: #1e1e1e;
  --line: #2c2c2c;
  --fg: #f4efe8;
  --muted: #9d968c;
  --accent: #ff7a1a;
  --accent-ink: #0b0b0b;
  --accent-soft: rgb(255 122 26 / .14);
  --danger: #ff5a4f;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; border-radius: 0 !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
  display: flex; flex-direction: column; gap: 22px;
}
.view { display: flex; flex-direction: column; gap: 22px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

header { display: flex; flex-direction: column; gap: 8px; }
.back {
  display: inline-flex; align-items: center; gap: 8px; width: fit-content; min-height: 44px; padding: 8px 16px;
  border: 1px solid var(--accent); background: var(--surface); color: var(--fg); text-decoration: none;
  font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: .06em; text-transform: uppercase;
  margin-bottom: 6px;
}
.back:hover, .back:active { background: var(--accent); color: var(--accent-ink); }
.eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .14em; color: var(--accent); }
h1 {
  font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 6vw, 52px);
  line-height: 1; margin: 0; letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; overflow-wrap: anywhere;
}
.meta-line { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; align-items: center; font-variant-numeric: tabular-nums; }
.meta-line b { color: var(--fg); font-weight: 600; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; font-size: 13px; color: var(--fg); cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.primary {
  background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); padding: 9px 16px;
  font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: .06em; font-size: 13px;
}
.primary:hover { filter: brightness(1.1); }
.primary:disabled, .btn:disabled { opacity: .6; cursor: default; }
.outline {
  background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 9px 16px;
  font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: .06em; font-size: 13px;
}
.outline:hover { background: var(--accent-soft); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search { flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); background: var(--surface); padding: 9px 12px; }
.search::placeholder { color: var(--muted); }
.notice { border: 1px dashed var(--line); padding: 10px 14px; color: var(--muted); font-size: 13px; }
.notice.ok { border-color: var(--accent); color: var(--fg); }

.status { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px; white-space: nowrap; }
.status.upcoming { color: var(--muted); border: 1px solid var(--line); }
.status.live { color: var(--accent-ink); background: var(--accent); }
.status.done { color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); }
.status.failed { color: var(--accent-ink); background: var(--danger); }
.code { font-family: var(--font-mono); font-size: 12px; color: var(--accent); background: var(--accent-soft); padding: 2px 7px; white-space: nowrap; }

/* Tournament rows */
.t-list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.t-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center;
  padding: 16px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--fg);
}
a.t-row:hover { background: var(--surface); }
a.t-row:hover .t-name { color: var(--accent); }
.t-row.pending { color: var(--muted); }
.t-name { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.05; text-transform: uppercase; letter-spacing: .02em; overflow-wrap: anywhere; }
.t-sub { color: var(--muted); font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; overflow-wrap: anywhere; }
.t-stats { display: flex; gap: 18px; align-items: center; font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; align-items: flex-end; }
.stat b { font-family: var(--font-display); font-size: 26px; line-height: 1; }
.stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
@media (max-width: 560px) { .t-row { grid-template-columns: 1fr; } .stat { align-items: flex-start; } }
@media (prefers-reduced-motion: no-preference) { .pulse { animation: pulse 1.4s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .35; } }

/* Bracket */
.section { display: flex; flex-direction: column; gap: 14px; }
.section-title { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: .06em; text-transform: uppercase; margin: 0; color: var(--accent); }
.bracket-scroll { overflow-x: auto; padding-bottom: 6px; }
.bracket { display: flex; gap: 32px; min-width: max-content; }
.col { display: flex; flex-direction: column; width: 230px; gap: 10px; }
.col-head { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.col-body { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 14px; }
.mbox { position: relative; background: var(--surface); border: 1px solid var(--line); cursor: pointer; text-align: left; padding: 0; width: 100%; display: flex; flex-direction: column; }
.mbox:hover { border-color: var(--accent); }
.mbox.dim { opacity: .25; }
.mbox.is-live { border-color: var(--accent); }
.col:not(:first-child) .mbox::before, .col:not(:last-child) .mbox::after { content: ""; position: absolute; top: 50%; width: 15px; border-top: 1px solid var(--line); }
.col:not(:first-child) .mbox::before { left: -17px; }
.col:not(:last-child) .mbox::after { right: -17px; }
.prow { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; color: var(--muted); }
.prow + .prow { border-top: 1px solid var(--line); }
.prow .pname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.prow .pscore { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.prow.win { color: var(--fg); font-weight: 600; }
.prow.win .pscore { color: var(--accent); }
.mfoot { display: flex; gap: 8px; align-items: center; padding: 4px 10px; background: var(--surface-2); font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }
.mfoot .spacer { flex: 1; }
.dot { width: 7px; height: 7px; background: var(--accent); display: inline-block; }
/* Home: Ongoing / Finished groups */
.t-groups { display: flex; flex-direction: column; gap: 28px; }
.t-group { display: flex; flex-direction: column; gap: 8px; }
.t-group-title { display: flex; align-items: baseline; gap: 10px; margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 22px;
  letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.t-group-title span { font-family: var(--font-body); font-size: 13px; font-weight: 600; letter-spacing: 0; color: var(--muted); }
/* Sync status and admin buttons on a tournament */
.sync-line { font-size: 12px; gap: 6px 14px; }
.sync-line .err { color: var(--danger); }
.admin-bar { display: flex; gap: 8px; flex-wrap: wrap; }
.btn.danger:hover { border-color: var(--danger); color: var(--danger); }
/* Tabs */
.tabs { display: flex; border-bottom: 1px solid var(--line); margin-top: -6px; }
.tab { display: inline-flex; align-items: center; min-height: 46px; padding: 8px 20px; margin-bottom: -1px; border-bottom: 3px solid transparent;
  font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
.tab:hover { color: var(--fg); }
.tab[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }
/* Decks tab */
.decks { display: flex; flex-direction: column; gap: 18px; }
.deck-chart { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 20px 28px; padding: 18px; border: 1px solid var(--line); background: var(--surface); }
.deck-chart svg { width: 200px; height: 200px; flex: none; }
.deck-chart .slice { transition: opacity .15s; cursor: default; }
.deck-chart .fade { opacity: .3; }
.dn-num { fill: var(--fg); font: 700 40px var(--font-display); text-anchor: middle; }
.dn-lbl { fill: var(--muted); font: 600 12px var(--font-body); text-anchor: middle; text-transform: uppercase; letter-spacing: .1em; }
.legend { flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.legend-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 6px; }
.legend-row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto 3.4em; gap: 10px; align-items: center; padding: 5px 0; font-size: 14px; transition: opacity .15s; }
.legend-row .lg-name { overflow-wrap: anywhere; }
.legend-row .n { font-weight: 600; font-variant-numeric: tabular-nums; }
.legend-row .pct { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.sw { width: 12px; height: 12px; display: inline-block; flex: none; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--bg); border: 1px solid var(--line); padding: 6px 10px; font-size: 13px; white-space: nowrap; color: var(--muted); }
.tip b { color: var(--fg); }
.pl-head { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 0 4px; margin-bottom: -10px; }
.pl-head small { font-size: inherit; text-transform: none; letter-spacing: 0; }
.players { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.pl-row { display: grid; grid-template-columns: 3em 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 10px 4px;
  background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--fg); text-align: left; font: inherit; }
button.pl-row { cursor: pointer; }
button.pl-row:hover { background: var(--surface); }
.pl-place { font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pl-place.top { color: var(--accent); }
.pl-place.alive { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg); }
.pl-thumb { width: 56px; height: 56px; border: 1px solid var(--line); background: var(--surface-2); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.pl-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
.pl-thumb .noimg { font-size: 10px; color: var(--muted); text-align: center; line-height: 1.2; padding: 2px; }
.pl-main { display: flex; flex-direction: column; min-width: 0; gap: 2px; }
.pl-name { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.pl-name .champ { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.pl-deck { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.pl-rec { text-align: right; font-family: var(--font-mono); font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pl-rec small { display: block; font-family: var(--font-body); font-size: 11px; color: var(--muted); }
/* Score | Players | Archetype table */
.dk-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.dk-table th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
  padding: 8px 10px; border-bottom: 1px solid var(--line); }
.dk-table td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; overflow-wrap: anywhere; }
.dk-table tbody tr:hover { background: var(--surface); }
.dk-table .c-score { width: 5.6em; }
.dk-table td.c-score { display: table-cell; }
.sc-rec { display: block; font-family: var(--font-mono); font-size: 15px; font-variant-numeric: tabular-nums; color: var(--fg); }
.sc-place { display: block; font-size: 12px; color: var(--muted); }
.sc-place.top { color: var(--accent); font-weight: 600; }
.c-player { font-weight: 600; font-size: 15px; }
.c-player .champ { display: inline-block; margin-left: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.cellbtn { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 32px; padding: 0; background: none; border: 0;
  color: inherit; font: inherit; text-align: left; cursor: pointer; }
.cellbtn:hover .nm-text { text-decoration: underline; text-underline-offset: 3px; }
.edit-ic { font-size: 13px; color: var(--muted); font-weight: 400; }
.arch-btn { color: var(--accent); font-weight: 600; }
.arch-btn:hover { text-decoration: underline; text-underline-offset: 3px; }
.arch-add { color: var(--muted); }
.arch-add:hover { color: var(--fg); }
.pic-ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; }
.dk-table .muted { color: var(--muted); }
@media (max-width: 600px) { .dk-table th, .dk-table td { padding: 9px 6px; } .dk-table .c-score { width: 4.6em; } }
.dk-img { margin-top: 6px; text-transform: none; letter-spacing: 0; }
.dk-img img { display: block; max-width: 100%; max-height: 40vh; border: 1px solid var(--line); }
.dk-none { border: 1px dashed var(--line); padding: 18px; text-align: center; color: var(--muted); font-weight: 400; font-size: 13px; }
.dk-img-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; text-transform: none; letter-spacing: 0; }
.dk-img-actions .btn { display: inline-flex; align-items: center; }
.dk-img-actions .busy { opacity: .6; pointer-events: none; }
/* The file input sits invisibly on top of the button, so a tap lands on the input itself (works on phones). */
.filebtn { position: relative; overflow: hidden; cursor: pointer; }
.filebtn input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }
.dk-link { margin-top: 10px; }
#imgFull { display: block; max-width: 100%; max-height: 72vh; margin: 0 auto; border: 1px solid var(--line); }
@media (max-width: 600px) {
  .tab { flex: 1; justify-content: center; }
  .deck-chart { justify-content: center; }
  .deck-chart svg { width: 180px; height: 180px; }
  .pl-row { grid-template-columns: 2.4em 48px minmax(0, 1fr) auto; gap: 10px; }
  .pl-thumb { width: 48px; height: 48px; }
}
/* Editor-only "no link" warnings */
.nolink { color: #ffc24b; font-weight: 600; white-space: nowrap; }
.nolink-note { border: 1px solid #ffc24b; color: #ffc24b; padding: 8px 12px; font-size: 13px; }
.warnbtn { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; width: fit-content; max-width: 100%; text-align: left;
  border: 1px solid #ffc24b; background: rgb(255 194 75 / .1); color: #ffc24b; padding: 8px 12px; font-size: 13px; cursor: pointer; min-height: 40px; }
.warnbtn b { color: #ffd98a; }
.warnbtn .warn-act { margin-left: 6px; text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
.warnbtn.on { background: #ffc24b; color: var(--accent-ink); }
.warnbtn.on b { color: var(--accent-ink); }
.warnbtn.ok { border-color: var(--line); background: var(--surface); color: var(--muted); }
/* Search results: only the matching matches, as a list in play order */
.results { display: flex; flex-direction: column; gap: 14px; max-width: 560px; }
.results-count { font-size: 13px; color: var(--muted); }
.results-count b { color: var(--fg); }
.result { display: flex; flex-direction: column; gap: 4px; }
.result-head { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.result-head span:first-child { color: var(--accent); }
/* Bracket drawn as a tree: each match sits level with the matches that feed it,
   joined by straight connector lines with right-angle turns (SVG under the boxes). */
.zoom { display: flex; gap: 0; flex: none; }
.zoom .btn { min-width: 40px; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.zoom .btn + .btn { border-left: none; }
.zoom .zlabel { min-width: 62px; font-size: 13px; }
.zoom #zFit { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.bracket-scroll { touch-action: pan-x pan-y; }
.bracket-scroll.zoomed { scroll-snap-type: none !important; }
.section:has(.bracket-scroll.zoomed) .swipe-hint { display: none; }
.zoomer > .bracket { width: max-content; transform-origin: 0 0; }
.bracket.tree { position: relative; }
.bracket.tree .col-body { position: relative; display: block; flex: none; }
.bracket.tree .mbox { position: absolute; left: 0; right: 0; }
.bracket.tree .mbox::before, .bracket.tree .mbox::after { display: none; }
.bracket .wires { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 0; }
.bracket .wires i { position: absolute; display: block; border: 0 solid #5a554f; }
.bracket .wires i.h { height: 0; border-top-width: 2px; }
.bracket .wires i.v { width: 0; border-left-width: 2px; }
.bracket .wires i.done { border-color: #8a4f22; }
.bracket.tree .col { position: relative; z-index: 1; }
.pcell { display: flex; flex-direction: column; min-width: 0; }
.pfrom { font-size: 11px; line-height: 1.3; color: var(--muted); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pfrom.lost { color: #c9a27e; }
.versus .side:last-child .pfrom { text-align: right; }
.prow { align-items: center; }
.prow .pname mark { background: none; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

.notes { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.links { display: flex; flex-direction: column; gap: 6px; }
.link-row { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.link-row a { text-decoration: none; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-row a:hover { text-decoration: underline; }
.link-row .host { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.score { font-family: var(--font-mono); color: var(--fg); font-variant-numeric: tabular-nums; }
.meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); align-items: center; }

.empty { border: 1px dashed var(--line); padding: 36px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty strong { color: var(--fg); font-family: var(--font-display); font-size: 24px; letter-spacing: .04em; text-transform: uppercase; }

dialog { border: 1px solid var(--line); border-top: 3px solid var(--accent); background: var(--surface); color: var(--fg); padding: 0; width: min(580px, calc(100vw - 32px)); max-height: calc(100vh - 48px); max-height: calc(100dvh - 32px); overflow-y: auto; overscroll-behavior: contain; }
dialog .form-actions { position: sticky; bottom: 0; background: var(--surface); margin: 0 -20px -20px; padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.swipe-hint { display: none; font-size: 12px; color: var(--muted); }
@media (max-width: 600px) {
  .wrap { padding-block: 18px 48px; gap: 16px; }
  .view { gap: 16px; }
  dialog { width: calc(100vw - 16px); max-width: none; }
  dialog form, .dlg { padding: 16px; gap: 12px; }
  dialog .form-actions { margin: 0 -16px -16px; padding-inline: 16px; }
  dialog h2 { font-size: 24px; }
  .btn { min-height: 40px; padding: 8px 14px; }
  .primary, .outline { min-height: 44px; }
  .lrow .btn { min-width: 44px; }
  .toolbar .primary, .toolbar .outline { flex: 1 1 auto; }
  .search { flex-basis: 100%; }
  .t-name { font-size: 22px; }
  .stat b { font-size: 22px; }
  .bracket-scroll { scroll-snap-type: x mandatory; margin-inline: -16px; padding-inline: 16px; scroll-padding-inline: 16px; }
  .bracket { gap: 12px; }
  .bracket.tree { gap: 28px; }
  .col { width: min(80vw, 300px); scroll-snap-align: start; }
  .col:not(:first-child) .mbox::before, .col:not(:last-child) .mbox::after { display: none; }
  .col-body { justify-content: flex-start; gap: 10px; }
  .prow { padding: 9px 12px; }
  .swipe-hint { display: block; }
  .versus .nm { font-size: 16px; }
}
dialog::backdrop { background: rgb(0 0 0 / .7); }
dialog form, .dlg { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
dialog h2 { font-family: var(--font-display); font-size: 28px; margin: 0; text-transform: uppercase; letter-spacing: .02em; overflow-wrap: anywhere; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid .full { grid-column: 1 / -1; }
@media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; min-width: 0; }
.field input, .field select, .field textarea, .lrow input { border: 1px solid var(--line); background: var(--bg); padding: 8px 10px; font-size: 16px; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--fg); min-width: 0; width: 100%; }
.field textarea { min-height: 100px; resize: vertical; }
.help { font-size: 13px; color: var(--muted); margin: 0; }
.lrow { display: grid; grid-template-columns: 1.6fr 1fr auto; gap: 8px; }
@media (max-width: 480px) { .lrow { grid-template-columns: 1fr auto; } .lrow .llabel { grid-column: 1 / 2; grid-row: 2; } }
.form-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; align-items: center; }
.err { color: var(--danger); font-size: 13px; }
.versus { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.versus .side { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.versus .side:last-child { text-align: right; }
.versus .nm { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.versus .nm.w { color: var(--accent); }
.versus .sc { font-family: var(--font-mono); font-size: 22px; }
.versus .mid { color: var(--muted); font-family: var(--font-display); font-size: 18px; }
</style>
</head>
<body>
<div id="root"></div>

<script id="mb-app">
(() => {
  const SHIPPED = null;   // read-only copies aren't made on the website; kept so shared checks stay simple
  const FONT_HREF = "https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap";

  const SHELL = `
<div class="wrap">
  <div class="notice" id="notice" hidden></div>
  <section id="home" class="view">
    <header>
      <div class="eyebrow">Tourney Logs</div>
      <h1>Tournaments</h1>
      <div class="meta-line" id="homeTally"></div>
    </header>
    <div class="toolbar">
      <input class="search" id="tSearch" type="search" placeholder="Search tournaments…" aria-label="Search tournaments">
      <button class="primary" id="addTBtn" type="button" hidden>Add tournament</button>
      <button class="btn" id="loginBtn" type="button" hidden>Log out</button>
    </div>
    <div id="tList"></div>
  </section>
  <section id="tview" class="view" hidden>
    <header>
      <a class="back" href="#">← All tournaments</a>
      <div class="eyebrow" id="tEyebrow"></div>
      <h1 id="tName"></h1>
      <div class="meta-line" id="tMeta"></div>
      <div class="meta-line sync-line" id="syncLine"></div>
      <div class="admin-bar" id="adminBar" hidden></div>
      <div id="linkWarn" hidden></div>
    </header>
    <nav class="tabs" id="tTabs" aria-label="Tournament views" hidden>
      <a class="tab" id="tabBracket" href="#">Bracket</a>
      <a class="tab" id="tabDecks" href="#">Decks</a>
    </nav>
    <div class="toolbar" id="mToolbar">
      <input class="search" id="mSearch" type="search" placeholder="Search players, notes, links…" aria-label="Search matches">
      <div class="zoom" id="zoomCtl" role="group" aria-label="Bracket zoom" hidden>
        <button class="btn" type="button" id="zOut" aria-label="Zoom out">−</button>
        <button class="btn zlabel" type="button" id="zReset" title="Back to 100%">100%</button>
        <button class="btn" type="button" id="zIn" aria-label="Zoom in">+</button>
        <button class="btn" type="button" id="zFit" title="Fit the bracket to the screen width">Fit</button>
      </div>
    </div>
    <div id="mArea"></div>
  </section>
</div>
<dialog id="detail"><div class="dlg" id="detailBody"></div></dialog>
<dialog id="deckDlg">
  <form id="deckForm" method="dialog">
    <h2 id="dkTitle">Deck</h2>
    <label class="field">Deck<input id="dkDeck" maxlength="60" placeholder="e.g. Snake-Eye" autocomplete="off"></label>
    <div class="field">Decklist image
      <div class="dk-img" id="dkImgBox"></div>
      <div class="dk-img-actions" id="dkImgActions">
        <span class="btn filebtn" id="dkPick">Upload image<input type="file" id="dkFile" accept="image/*" aria-label="Upload decklist image"></span>
        <button class="btn" type="button" id="dkRemove">Remove image</button>
      </div>
      <p class="help" id="dkImgHelp"></p>
    </div>
    <div class="err" id="dkErr" hidden></div>
    <div class="form-actions">
      <button class="btn" type="button" id="dkCancel">Cancel</button>
      <button class="primary" type="submit" id="dkSave">Save deck</button>
    </div>
  </form>
</dialog>
<dialog id="imgDlg"><div class="dlg"><h2 id="imgTitle"></h2><img id="imgFull" alt=""><div class="form-actions"><button class="btn" type="button" id="imgClose">Close</button></div></div></dialog>
<dialog id="loginDlg">
  <form id="loginForm" method="dialog">
    <h2>Admin login</h2>
    <label class="field">Password<input id="lgPass" type="password" autocomplete="current-password" required></label>
    <div class="err" id="lgErr" hidden></div>
    <div class="form-actions">
      <button class="btn" type="button" id="lgCancel">Cancel</button>
      <button class="primary" type="submit" id="lgGo">Log in</button>
    </div>
  </form>
</dialog>
<dialog id="addDlg">
  <form id="addForm" method="dialog">
    <h2>Add tournament</h2>
    <label class="field">Challonge link<input id="aUrl" inputmode="url" placeholder="https://challonge.com/your_bracket" required></label>
    <p class="help">Every round, match, player and score is read from Challonge, and kept up to date while the tournament is running.</p>
    <div class="err" id="aErr" hidden></div>
    <div class="form-actions">
      <button class="btn" type="button" id="aCancel">Cancel</button>
      <button class="primary" type="submit" id="aSave">Add tournament</button>
    </div>
  </form>
</dialog>
<dialog id="mEditor">
  <form id="mForm" method="dialog">
    <h2>Edit match</h2>
    <div class="grid">
      <label class="field">Player / team 1<input id="fP1" maxlength="80"></label>
      <label class="field">Player / team 2<input id="fP2" maxlength="80"></label>
      <label class="field">Score<input id="fScore" maxlength="40" placeholder="2-1"></label>
      <label class="field">Winner
        <select id="fWinner"><option value="">Not decided</option><option value="p1">Player / team 1</option><option value="p2">Player / team 2</option></select>
      </label>
      <label class="field">Status
        <select id="fStatus"><option value="upcoming">Upcoming</option><option value="live">Live</option><option value="done">Done</option></select>
      </label>
      <label class="field">Date &amp; time<input id="fWhen" type="datetime-local"></label>
      <label class="field full">Notes<textarea id="fNotes" maxlength="8000" placeholder="Lineups, map picks, who to watch…"></textarea></label>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span class="field">Links</span>
      <div id="linkRows" style="display:flex;flex-direction:column;gap:8px"></div>
      <div><button class="btn" type="button" id="addLink">+ Add link</button></div>
    </div>
    <div class="err" id="mErr" hidden></div>
    <div class="form-actions">
      <button class="btn" type="button" id="mCancel">Cancel</button>
      <button class="primary" type="submit" id="mSave">Save match</button>
    </div>
  </form>
</dialog>`;
  document.getElementById("root").innerHTML = SHELL;

  const PRESET_ORDER = { "group stage": 0, "round of 128": 5, "round of 64": 10, "round of 32": 20, "round of 16": 30,
    "quarter-finals": 40, "semi-finals": 50, "third place": 55, "final": 60, "grand final": 70 };

  const $ = (id) => document.getElementById(id);
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "class") el.className = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
    return el;
  }
  // replaceChildren() would print a skipped (null) child as the text "null".
  const setKids = (el, ...kids) => el.replaceChildren(...kids.flat().filter(k => k != null && k !== false));
  const newId = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // ---------- state ----------
  let store = null, canWrite = false;
  let tournaments = [], imports = [], tLoaded = false;
  let currentTid = null, matches = [], mLoaded = false, unsubM = null;
  let tab = "bracket", decks = [], dLoaded = false, unsubD = null, assets = null;
  let tQuery = "", mQuery = "";
  let missingOnly = false;   // editor-only filter: played matches that have no link yet
  let editingMid = null, detailId = null;
  let countsQ = Promise.resolve();

  // ---------- helpers ----------
  function safeUrl(raw) {
    let s = String(raw || "").trim();
    if (!s) return null;
    if (/^http:\/\//i.test(s)) s = "https://" + s.slice(7);
    else if (!/^https:\/\//i.test(s)) s = "https://" + s.replace(/^\/+/, "");
    try { const u = new URL(s); return u.protocol === "https:" ? u.href : null; } catch { return null; }
  }
  const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };
  function challongeSlug(url) {
    try {
      const u = new URL(url); const host = u.hostname.toLowerCase();
      if (host !== "challonge.com" && !host.endsWith(".challonge.com")) return null;
      const parts = u.pathname.split("/").filter(Boolean).filter(p => !/^[a-z]{2}(-[A-Za-z]{2})?$/.test(p) || p.length > 5);
      const slug = (parts[0] === "tournaments" ? parts[1] : parts[0]) || "";
      if (!/^[A-Za-z0-9_]+$/.test(slug)) return null;
      const sub = host.endsWith(".challonge.com") && host !== "www.challonge.com" ? host.slice(0, -".challonge.com".length) : "";
      return sub ? sub + "-" + slug : slug;
    } catch { return null; }
  }
  function fmtWhen(v) {
    if (!v) return ""; const d = new Date(v); if (isNaN(d)) return "";
    return d.toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  }
  function fmtDate(v) {
    if (!v) return ""; const d = new Date(String(v).slice(0, 10) + "T12:00:00"); if (isNaN(d)) return "";
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }
  const statusOf = (m) => ["upcoming", "live", "done"].includes(m.status) ? m.status : "upcoming";
  function splitScore(s) { const r = /^\s*(\d+)\s*[-–:]\s*(\d+)\s*$/.exec(s || ""); return r ? [r[1], r[2]] : null; }
  function winnerOf(m) {
    if (m.winner === "p1" || m.winner === "p2") return m.winner;
    const sc = splitScore(m.score);
    if (statusOf(m) !== "live" && sc && Number(sc[0]) !== Number(sc[1])) return Number(sc[0]) > Number(sc[1]) ? "p1" : "p2";
    return "";
  }
  const roundOrder = (m) => Number.isFinite(m.roundOrder) ? m.roundOrder : (PRESET_ORDER[String(m.round || "").toLowerCase()] ?? 500);
  const roundLabel = (m) => String(m.round || "Round");
  const sectionOf = (m) => String(m.section || "");
  function roundText(m) {
    const s = sectionOf(m), l = roundLabel(m);
    return !s || /grand final/i.test(l) || l.toLowerCase().startsWith(s.toLowerCase()) ? l : s + " · " + l;
  }
  // Underline the searched text inside a player's name.
  function markName(name) {
    const words = mQuery ? mQuery.split(/\s+/).filter(Boolean) : [];
    const low = name.toLowerCase(), w = words.find(x => low.includes(x));
    if (!w) return name;
    const i = low.indexOf(w);
    return [name.slice(0, i), h("mark", null, name.slice(i, i + w.length)), name.slice(i + w.length)];
  }
  function codeOf(m) {
    const label = roundLabel(m), words = label.replace(/-/g, " ").split(/\s+/).filter(Boolean);
    let c = /^round of (\d+)$/i.test(label) ? "R" + label.match(/\d+/)[0]
      : words.length === 1 ? words[0].slice(0, 3).toUpperCase()
      : words.map(w => /^\d+$/.test(w) ? w : w[0].toUpperCase()).join("");
    if (sectionOf(m) && !/grand final/i.test(label) && !label.toLowerCase().startsWith(sectionOf(m).toLowerCase())) c = sectionOf(m)[0].toUpperCase() + "·" + c;
    return c + (m.num ? "-" + m.num : "");
  }
  const cmpMatch = (a, b) => roundOrder(a) - roundOrder(b) || (Number(a.num) || 9999) - (Number(b.num) || 9999) || String(a.p1 || "").localeCompare(String(b.p1 || ""));
  function mMatchesQuery(m) {
    if (!mQuery) return true;
    const hay = [m.p1, m.p2, m.notes, m.score, m.round, m.section, ...(Array.isArray(m.links) ? m.links.flatMap(l => [l.label, l.url]) : [])].join(" ").toLowerCase();
    return mQuery.split(/\s+/).every(w => hay.includes(w));
  }
  function showNotice(t, ok) { $("notice").textContent = t || ""; $("notice").hidden = !t; $("notice").classList.toggle("ok", !!ok); }
  // The grand final reset is only played if the losers-bracket player (player 2) wins the
  // grand final; once player 1 has won it, the reset is hidden and not counted.
  const isRound = (m, name) => String(m.round || "").trim().toLowerCase() === name;
  function shownMatches(list) {
    const gf = list.find(m => isRound(m, "grand final"));
    const resetOff = gf && statusOf(gf) === "done" && winnerOf(gf) === "p1";
    return resetOff ? list.filter(m => !isRound(m, "grand final reset")) : list;
  }
  const countsFrom = (all) => { const list = shownMatches(all); return { total: list.length, live: list.filter(m => statusOf(m) === "live").length, done: list.filter(m => statusOf(m) === "done").length }; };
  const currentT = () => tournaments.find(t => t.id === currentTid);
  const linkCount = (m) => (Array.isArray(m.links) ? m.links : []).filter(l => safeUrl(l.url)).length;
  // Only people who can edit are warned about played matches with no link; viewers and shipped copies never see it.
  const needsLink = (m) => canWrite && !SHIPPED && statusOf(m) !== "upcoming" && !linkCount(m);
  function linkRow(l) {
    const url = safeUrl(l.url); if (!url) return null;
    const label = (l.label || "").trim() || hostOf(url) || url;
    return h("div", { class: "link-row" },
      h("a", { href: url, target: "_blank", rel: "noopener noreferrer" }, label),
      label !== hostOf(url) ? h("span", { class: "host" }, hostOf(url)) : null);
  }

  // ---------- routing ----------
  function route() {
    // Hidden way in for the owner: <site>/#login opens the login box.
    if (location.hash === "#login") {
      history.replaceState(null, "", location.pathname);
      if (!canWrite) { $("lgPass").value = ""; $("lgErr").hidden = true; $("loginDlg").showModal(); $("lgPass").focus(); }
    }
    const r = /^#t-([A-Za-z0-9_-]+)(?:\/(decks))?$/.exec(location.hash);
    const tid = r ? r[1] : null;
    const newTab = r && r[2] === "decks" ? "decks" : "bracket";
    if (tid !== currentTid) {
      currentTid = tid; unsubM?.(); unsubM = null; matches = []; mLoaded = false; mQuery = ""; missingOnly = false; $("mSearch").value = "";
      unsubD?.(); unsubD = null; decks = []; dLoaded = false;
      if (tid && store) unsubM = store.watchMatches(tid, (list) => { matches = list; mLoaded = true; render(); },
        () => { mLoaded = true; showNotice("This tournament's matches can't be loaded right now. Reopen the page to try again."); render(); });
      if (tid && store && store.watchDecks) unsubD = store.watchDecks(tid, (list) => { decks = list; dLoaded = true; render(); },
        () => { dLoaded = true; render(); });
      window.scrollTo(0, 0);
    } else if (newTab !== tab) window.scrollTo(0, 0);
    tab = newTab;
    render();
  }
  window.addEventListener("hashchange", route);

  // ---------- home ----------
  function renderHome() {
    $("addTBtn").hidden = !canWrite; $("loginBtn").hidden = !canWrite;   // no public login button; log in at /#login
    const live = tournaments.filter(t => t.counts?.live > 0).length;
    setKids($("homeTally"), 
      h("span", null, h("b", null, tournaments.length), tournaments.length === 1 ? " tournament" : " tournaments"),
      live ? h("span", null, h("b", null, live), " with live matches") : null,
      SHIPPED?.shippedAt ? h("span", null, "Updated " + fmtDate(SHIPPED.shippedAt)) : null);
    const list = $("tList");
    if (!tLoaded) { list.replaceChildren(h("div", { class: "empty" }, h("strong", null, "Loading tournaments…"))); return; }
    const pending = canWrite ? imports.filter(i => i.status !== "done") : [];
    if (!tournaments.length && !pending.length) {
      list.replaceChildren(h("div", { class: "empty" }, h("strong", null, "No tournaments yet"),
        h("span", null, canWrite ? "Add one from its Challonge link." : "Tournaments show up here once they're added."),
        canWrite ? h("button", { class: "primary", type: "button", onclick: openAdd }, "Add tournament") : null));
      return;
    }
    const shown = tournaments.filter(t => !tQuery || [t.name, t.game, t.format].join(" ").toLowerCase().includes(tQuery))
      .sort((a, b) => String(b.date || b.createdAt || "").localeCompare(String(a.date || a.createdAt || "")));
    const tRow = (t) => {
      const c = t.counts || { total: 0, live: 0, done: 0 };
      return h("a", { class: "t-row", href: "#t-" + t.id },
        h("div", { style: "display:flex;flex-direction:column;gap:4px;min-width:0" },
          h("div", { class: "t-name" }, t.name || "Untitled tournament"),
          h("div", { class: "t-sub" },
            c.live ? h("span", { class: "status live" }, c.live + " live") : null,
            t.game ? h("span", null, t.game) : null,
            t.format ? h("span", null, t.format) : null,
            fmtDate(t.date) ? h("span", null, fmtDate(t.date)) : null)),
        h("div", { class: "t-stats" },
          h("div", { class: "stat" }, h("b", null, c.total || 0), h("span", null, "Matches")),
          h("div", { class: "stat" }, h("b", null, c.done || 0), h("span", null, "Played"))));
    };
    const ongoing = shown.filter(t => !tDone(t)), finished = shown.filter(tDone);
    const group = (title, items) => items.length ? h("section", { class: "t-group" },
      h("h2", { class: "t-group-title" }, title, h("span", null, items.length)), h("div", { class: "t-list" }, items)) : null;
    const pendingRows = pending.map(i => h("div", { class: "t-row pending" },
        h("div", { style: "display:flex;flex-direction:column;gap:4px;min-width:0" },
          h("div", { class: "t-name" }, i.slug || hostOf(i.url)),
          h("div", { class: "t-sub" },
            i.status === "failed" ? h("span", { class: "status failed" }, "Couldn't import") : h("span", { class: "status upcoming pulse" }, "Importing"),
            h("span", null, i.status === "failed" ? (i.message || "Claude couldn't read this bracket.") : "Claude is building this bracket. It appears here when it's ready."))),
        h("div", { class: "t-sub" }, i.url)));
    if (!pendingRows.length && !shown.length) { list.replaceChildren(h("div", { class: "empty" }, h("strong", null, "Nothing matches"), h("span", null, "Try a different search."))); return; }
    setKids(list, h("div", { class: "t-groups" },
      group("Ongoing", [...pendingRows, ...ongoing.map(tRow)]),
      group("Finished", finished.map(tRow))));
  }

  // ---------- tournament ----------
  function renderTournament() {
    const t = currentT();
    if (!t) {
      $("zoomCtl").hidden = true; $("linkWarn").hidden = true; $("adminBar").hidden = true; $("syncLine").replaceChildren();
      $("tEyebrow").textContent = ""; $("tName").textContent = tLoaded ? "Tournament not found" : "Loading…"; $("tMeta").replaceChildren();
      $("mArea").replaceChildren(tLoaded ? h("div", { class: "empty" }, h("a", { href: "#" }, "Back to all tournaments")) : "");
      return;
    }
    $("tEyebrow").textContent = [t.game, t.format].filter(Boolean).join(" · ") || "Tournament";
    $("tName").textContent = t.name || "Untitled tournament";
    const c = countsFrom(matches), url = safeUrl(t.sourceUrl);
    setKids($("tMeta"),
      fmtDate(t.date) ? h("span", null, fmtDate(t.date)) : null,
      h("span", null, h("b", null, c.total), " matches"),
      c.live ? h("span", null, h("b", null, c.live), " live") : null,
      h("span", null, h("b", null, c.done), " played"),
      url ? h("a", { href: url, target: "_blank", rel: "noopener noreferrer" }, "Bracket on " + hostOf(url) + " ↗") : null);
    setKids($("syncLine"),
      t.syncedAt ? h("span", null, "Updated from Challonge " + ago(t.syncedAt)) : null,
      t.syncedAt && !tDone(t) && t.autoSync !== false ? h("span", null, "Refreshes automatically while it's running") : null,
      canWrite && t.lastSyncError ? h("span", { class: "err" }, "Last refresh failed: " + t.lastSyncError) : null);
    $("adminBar").hidden = !canWrite;
    if (canWrite) setKids($("adminBar"),
      h("button", { class: "btn", type: "button", onclick: (e) => refreshTournament(t, e.currentTarget) }, "Refresh from Challonge"),
      h("button", { class: "btn danger", type: "button", onclick: () => deleteTournament(t) }, "Delete tournament"));
    // Editors only: how many played matches still have no link, with a button to list them.
    const missing = shownMatches(matches).filter(needsLink);

    }
    const soon = () => { clearTimeout(kick); kick = setTimeout(loadOne, 0); };
    document.addEventListener("visibilitychange", () => { if (!document.hidden) { loadList(); if (oneTid) loadOne(); } });
    const after = async (promise) => { const r = await promise; loadOne(); loadList(); return r; };
    const tPath = (tid) => "/api/tournaments/" + encodeURIComponent(tid);
    return {
      watchTournaments(cb, err) { tWatch = { ok: cb, err }; loadList(); return () => { tWatch = null; clearTimeout(tTimer); }; },
      watchImports() { return () => {}; },
      watchMatches(tid, cb, err) {
        oneTid = tid; mCb = cb; mErr = err; soon();
        return () => { if (oneTid === tid) { oneTid = null; mCb = null; mErr = null; clearTimeout(oneTimer); } };
      },
      watchDecks(tid, cb) { dCb = cb; soon(); return () => { dCb = null; }; },
      getMatches: async (tid) => (await apiCall("GET", tPath(tid))).matches,
      getDecks: async (tid) => (await apiCall("GET", tPath(tid))).decks,
      saveMatch: (tid, id, data) => after(apiCall("PUT", tPath(tid) + "/matches/" + encodeURIComponent(id), data)),
      saveDeck: (tid, id, data) => after(apiCall("PUT", tPath(tid) + "/decks/" + encodeURIComponent(id), data)),
      setCounts: (tid, counts) => after(apiCall("PATCH", tPath(tid), { counts })),
      addTournament: (url) => after(apiCall("POST", "/api/tournaments", { url })),
      refresh: (tid) => after(apiCall("POST", tPath(tid) + "/refresh")),
      remove: (tid) => after(apiCall("DELETE", tPath(tid))),
    };
  }

  function start() {
    const timer = setTimeout(() => { if (!tLoaded) showNotice("Can't reach the tournaments yet. They'll appear once the connection comes back."); }, 10000);
    store.watchTournaments((list, meta) => {
      tournaments = list; tLoaded = true; clearTimeout(timer);
      if ($("notice").textContent.startsWith("Can't reach")) showNotice("");
      render();
    }, () => { clearTimeout(timer); tLoaded = true; showNotice("The tournaments can't be loaded right now. Reload the page to try again."); render(); });
    currentTid = undefined; route();
  }

  render();
  store = restStore();
  (async () => {
    try { const me = await apiCall("GET", "/api/me"); canWrite = !!me.admin; }
    catch { canWrite = false; }
    assets = canWrite ? imageStore : null;
    start();
  })();
})();
</script>
</body>
</html>
